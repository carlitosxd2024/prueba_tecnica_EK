spring:
  application:
    name: clientes-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clientes}
    username: ${DB_USER:clientes}
    password: ${DB_PASSWORD:clientes}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
